@if (route(); as path) {
  <a
    class="labeled-button"
    [routerLink]="path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <img class="button-image" [src]="image()" alt="" aria-hidden="true" />
    <span>{{ label() }}</span>
  </a>
} @else {
  <button class="labeled-button" type="button">
    <img class="button-image" [src]="image()" alt="" aria-hidden="true" />
    <span>{{ label() }}</span>
  </button>
}
