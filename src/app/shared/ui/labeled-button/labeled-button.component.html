@if (route(); as path) {
  <a
    class="labeled-button"
    [routerLink]="path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-label]="label()"
    [title]="collapsed() ? label() : null"
  >
    <img class="button-image" [src]="image()" alt="" aria-hidden="true" />
    @if (!collapsed()) {
      <span>{{ label() }}</span>
    }
  </a>
} @else {
  <button
    class="labeled-button"
    type="button"
    [attr.aria-label]="label()"
    [title]="collapsed() ? label() : null"
  >
    <img class="button-image" [src]="image()" alt="" aria-hidden="true" />
    @if (!collapsed()) {
      <span>{{ label() }}</span>
    }
  </button>
}
