<main class="main-content">
  @if (loading.isLoading()) {
    <p class="data-message" role="status">{{ 'dashboard.loading' | translate }}</p>
  }
  <app-statistics-cards [metrics]="metrics()" />
  <section class="board-toolbar" [attr.aria-label]="'board.controls' | translate">
    <div class="filters" [attr.aria-label]="'board.filters' | translate">
      @for (filter of filters; track filter.status) {
        <button
          type="button"
          [class.selected]="activeFilter() === filter.status"
          [attr.aria-pressed]="activeFilter() === filter.status"
          (click)="selectFilter(filter.status)"
        >
          {{ filter.label | translate }}
        </button>
      }
    </div>
    <div class="board-actions">
      <p-select
        [options]="priorityOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedPriority()"
        (ngModelChange)="selectedPriority.set($event)"
        [ariaLabel]="'task.filter.priority' | translate"
        [placeholder]="'task.filter.priorityPlaceholder' | translate"
        appendTo="body"
        styleClass="task-filter-select"
      />
      <p-select
        [options]="assigneeOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedAssignee()"
        (ngModelChange)="selectedAssignee.set($event)"
        [ariaLabel]="'task.filter.assignee' | translate"
        [placeholder]="'task.filter.assigneePlaceholder' | translate"
        appendTo="body"
        styleClass="task-filter-select"
      />
      <button class="create-button" type="button" (click)="openCreateForm()">
        ＋ {{ 'task.new' | translate }}
      </button>
    </div>
  </section>
  <div class="board-workspace">
    <app-task-board
      [tasks]="tasks()"
      [saving]="isSavingMove || loading.isLoading()"
      (editRequested)="editTask($event)"
      (deleteRequested)="deleteTask($event)"
      (taskMoved)="moveTask($event)"
    />
    <app-activity-feed [tasks]="activityTasks()" />
  </div>
</main>
