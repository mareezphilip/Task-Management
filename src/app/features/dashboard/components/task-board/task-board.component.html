<section class="board" aria-label="Tasks by status" cdkDropListGroup>
  @for (column of columns; track column.status) {
  <section class="board-column" [attr.aria-label]="column.label + ' tasks'">
    <header class="column-header">
      <h2>{{ column.label }}</h2><span>{{ tasksFor(column.status).length }}</span>
    </header>
    <div class="task-list" cdkDropList [cdkDropListData]="column.status" [cdkDropListDisabled]="saving()" (cdkDropListDropped)="dropTask($event)">
      @for (task of tasksFor(column.status); track task.id) { <app-task-card cdkDrag [cdkDragData]="task" [task]="task"
        (editRequested)="editRequested.emit($event)" (deleteRequested)="deleteRequested.emit($event)" /> }
    </div>
  </section>
  }
</section>
