<section class="activity-feed" aria-labelledby="activity-title">
  <div class="activity-heading">
    <div>
      <h2 id="activity-title">{{ 'activity.title' | translate }}</h2>
      <p>{{ 'activity.subtitle' | translate }}</p>
    </div>
  </div>
  @if (recentActivities().length) {
    <div class="activity-list">
      @for (activity of recentActivities(); track activity.id) {
        <app-activity-card [activity]="activity" />
      }
    </div>
  } @else {
    <p class="activity-empty">{{ 'activity.empty' | translate }}</p>
  }
</section>
